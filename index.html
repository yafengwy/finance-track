<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance Track">
<meta name="theme-color" content="#F2F2F4">
<title>Finance Track</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..600,0..1,0&display=block">
<style>
:root {
  --brand: #2F9E6E;
  --accent: #3478F6;
  --brand-soft: #E3F4EC;
  --bg: #F2F2F4;
  --card: #FFFFFF;
  --border: #E6E6EA;
  --line: #EDEDF0;
  --text: #1C1C1E;
  --sub: #8A8A8E;
  --inc: #1F9D63;
  --exp: #D93025;
  --good: #1F7A4F;
  --bad: #C0271B;
  --grey: #80868F;
  --link: #3478F6;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', sans-serif; font-size: 16px; font-weight: 400; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ms { font-variation-settings: 'FILL' 0, 'wght' 350; font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + var(--safe-bottom)); }

/* header */
.top { background: rgba(242,242,244,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--text); padding: calc(var(--safe-top) + 6px) 12px 8px; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; height: 52px; }
.bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
.icon-btn.round { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.08); color: var(--text); text-decoration: none; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; color: inherit; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.icon-btn .ms { font-size: 24px; }
.tabs { display: flex; gap: 2px; padding: 3px; background: #E4E4E8; border-radius: 10px; margin: 4px 4px 0; }
.tabs a { flex: 1; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: var(--text); text-decoration: none; border-radius: 8px; }
.tabs a[aria-current="page"] { background: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

.page { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.h2 { font-size: 17px; font-weight: 600; margin: 0; }
.meta { font-size: 12px; color: var(--sub); }
.pill-btn { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pill-btn .ms { font-size: 18px; }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.danger { color: var(--bad); }

/* accounts */
.acc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; border: 0; border-radius: 12px; padding: 10px; height: 84px; color: #fff; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
.tile .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sb { font-size: 11px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .amt { font-size: 16px; font-weight: 600; }
.tile .dot { position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bg); }
.tile.add { background: var(--card); color: var(--link); border: 1.5px solid #C9CED8; align-items: center; justify-content: center; flex-direction: row; gap: 4px; font-weight: 600; font-size: 13px; }
.banner { background: var(--card); border: 0; border-radius: 14px; padding: 14px; display: flex; gap: 12px; }
.banner .ms { color: var(--exp); font-size: 22px; }
.banner .t { font-weight: 600; font-size: 14px; }
.empty { background: var(--card); border-radius: 14px; padding: 24px 16px; text-align: center; color: var(--sub); display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* cards */
.card { background: var(--card); border: 0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-head > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.card-head .icon-btn { color: var(--sub); margin: -8px -10px 0 0; }
.big { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; }
.bar-row { display: flex; flex-direction: column; gap: 6px; }
.track { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; min-height: 36px; padding: 0 4px; font-size: 13px; font-weight: 400; color: var(--sub); }

.cat-row { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cat-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 0; border: 0; background: none; text-align: left; }
.cat-btn .n { flex: 1; font-weight: 400; display: flex; align-items: center; gap: 2px; min-width: 0; }
.cat-btn .a { font-weight: 600; }
.cat-btn .p { width: 52px; text-align: right; font-size: 13px; font-weight: 600; }
.chev { font-size: 20px; color: var(--sub); transition: transform .15s; }
.open .chev { transform: rotate(180deg); }
.subs { padding: 0 0 6px 44px; }
.sub { display: flex; align-items: center; gap: 12px; min-height: 40px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--sub); }
.sub .n { flex: 1; }
.sub .p { width: 52px; text-align: right; font-size: 12px; }
.ci { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; }
.ci .ms { font-size: 18px; font-variation-settings: 'FILL' 1, 'wght' 500; }
.ci.unknown { background: #9AA0A8; }
.ci.lg { width: 96px; height: 96px; }
.ci.lg .ms { font-size: 48px; }

/* transactions */
.chips { display: flex; gap: 8px; overflow-x: auto; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.day { font-size: 13px; font-weight: 600; color: var(--sub); padding: 8px 4px 4px; }
.list { background: var(--card); border: 0; border-radius: 14px; overflow: hidden; }
.tx { display: flex; align-items: center; gap: 4px; width: 100%; min-height: 60px; padding: 0 14px 0 6px; border-top: 1px solid var(--line); }
.tx:first-child { border-top: 0; }
.tx-ico { width: 48px; height: 56px; flex-shrink: 0; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.tx-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; border: 0; background: none; text-align: left; padding: 0; color: inherit; }
.tx .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tx .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .a { font-weight: 600; }
.tx.transfer { color: var(--grey); }
.tx.transfer .a { text-decoration: line-through; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: var(--line); color: var(--sub); }

/* settings lists */
.set-list { background: var(--card); border: 0; border-radius: 14px; overflow: hidden; }
.set-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; text-decoration: none; color: var(--text); }
.set-item:first-child { border-top: 0; }
.set-item .n { flex: 1; font-weight: 400; }
.set-item .v { color: var(--sub); }
.set-item.hidden-cat { opacity: .45; }
.center { display: flex; justify-content: center; padding: 8px 0; }
.icon-edit { position: relative; border: 0; background: none; padding: 0; border-radius: 50%; }
.icon-edit .pen { position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 50%; background: #EAF1FF; color: var(--link); display: flex; align-items: center; justify-content: center; }
.switch { appearance: none; width: 52px; height: 32px; border-radius: 999px; background: #C9CED8; position: relative; transition: background .15s; margin: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch:checked { background: #34C759; }
.switch:checked::after { left: 23px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--line); border-radius: 999px; }
.seg button { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font-size: 13px; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(21,24,29,.12); }

/* drawer + sheet */
.scrim { position: fixed; inset: 0; background: rgba(15,17,20,.45); z-index: 20; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 82vw); background: var(--card); z-index: 21; padding: calc(var(--safe-top) + 16px) 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.drawer .who { padding: 8px 12px 16px; font-size: 13px; color: var(--sub); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.drawer a, .drawer button { display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 12px; border: 0; border-radius: 10px; background: none; text-decoration: none; color: var(--text); font-weight: 400; font-size: 16px; text-align: left; }
.drawer .ms { color: var(--accent); font-size: 24px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--card); z-index: 21; border-radius: 18px 18px 0 0; padding: 12px 16px calc(20px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
.sheet > * { flex-shrink: 0; }
.sheet { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
body.sheet-open { overflow: hidden; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #D5D9E0; }
.sheet-top { position: sticky; top: -12px; z-index: 2; margin: -12px -16px 0; padding: 8px 12px 4px; background: var(--card); display: flex; justify-content: center; align-items: flex-start; min-height: 52px; }
.sheet-x { position: absolute; right: 12px; top: 8px; width: 36px; height: 36px; }
.sheet-x .ms { font-size: 20px; }
.sticky-save { position: sticky; bottom: calc(-20px - var(--safe-bottom)); margin: 4px -16px calc(-20px - var(--safe-bottom)); padding: 10px 16px calc(14px + var(--safe-bottom)); background: linear-gradient(rgba(255,255,255,0), #fff 30%); }
.sticky-save .pill-btn { width: 100%; justify-content: center; height: 50px; font-size: 17px; border-radius: 14px; }
.sheet h3 { margin: 0; font-size: 18px; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--sub); }
.input { height: 46px; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; background: #fff; font-size: 16px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.opt input { width: 20px; height: 20px; accent-color: var(--brand); }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 4px; border: 0; border-radius: 10px; background: none; text-align: left; }
.pick.sub { padding-left: 44px; min-height: 44px; }
.pick[aria-pressed="true"] { background: #E3F1EA; }
.pick .n { flex: 1; font-weight: 400; }
.grid-icons { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.grid-icons button { height: 48px; border-radius: 12px; border: 1px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; }
.grid-icons button[aria-pressed="true"] { border: 2px solid var(--brand); background: #E3F1EA; }
.swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.swatches button { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; }
.swatches button[aria-pressed="true"] { border-color: var(--text); }
.btns { display: flex; gap: 10px; }
.btns .pill-btn { flex: 1; justify-content: center; height: 48px; font-size: 15px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }

.fab { position: fixed; right: max(20px, calc(50vw - 260px)); bottom: calc(24px + var(--safe-bottom)); width: 60px; height: 60px; border-radius: 50%; border: 0; background: #2563EB; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(37,99,235,.35); z-index: 6; }
.fab .ms { font-size: 30px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip .ms { font-size: 16px; vertical-align: -3px; }
select.input { appearance: auto; }
.searchbar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0 6px 0 12px; height: 46px; }
.searchbar > .ms { color: var(--sub); }
.searchbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; height: 100%; }
.loadall { display: inline-flex; align-items: center; gap: 3px; height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; background: none; font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.loadall .ms { font-size: 16px; }
.loadall[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.freq { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.freq button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px; border: 0; border-radius: 12px; background: none; font-size: 12px; font-weight: 600; }
.freq button span:last-child { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.freq button[aria-pressed="true"] { background: #E3F1EA; }
.freq .ci { width: 44px; height: 44px; }
.freq .ci .ms { font-size: 22px; }
.pick.open .chev { transform: rotate(180deg); }
.pick .chev { margin-left: auto; }
.amount-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 0; font-size: 44px; font-weight: 600; padding: 4px 4px 0; }
.amount-row input { max-width: 75%; text-align: right; padding: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 44px; font-weight: 600; }
.set-item > .ms { color: var(--accent); width: 32px; text-align: center; }
.wide { width: 100%; justify-content: center; height: 48px; }
.row-select { margin-left: auto; max-width: 62%; height: 36px; border: 0; background: none; color: var(--sub); font-size: 16px; text-align: right; direction: rtl; }
input.row-select { direction: ltr; }
.row-select:focus { outline: none; color: var(--accent); }
.msel-top { display: flex; align-items: center; border-top: 1px solid var(--line); }
.set-list > .msel-top:first-child { border-top: 0; }
.msel-top .msel-row { flex: 1; border: 0; }
.msel-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 14px; border-top: 1px solid var(--line); }
.msel-row.sub { padding-left: 52px; }
.set-list > .msel-row:first-child { border-top: 0; }
.msel-row input { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }
.msel-row .n { flex: 1; }
.chev.up { transform: rotate(180deg); }
.drawer-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.sec-head .meta { font-size: 12px; }
.ci.sq { border-radius: 8px; }
.opt-row .check-ico { color: var(--accent); font-size: 22px; margin-left: auto; }
.opt-row[aria-pressed="true"] .n { font-weight: 600; }
.lbl { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
.lbls { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.lchip[aria-pressed="true"] { background: var(--lc); border-color: var(--lc); color: #fff; }
.lchip { border-color: var(--lc); color: var(--lc); }
.bare-input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; height: 40px; }
.row-date { margin-left: auto; border: 0; background: none; font-size: 16px; color: var(--sub); height: 36px; }
.set-item .v .lbl { vertical-align: middle; }
.sheet .set-item .v { max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut-wrap { position: relative; width: 220px; height: 220px; margin: 4px auto 0; }
.donut { width: 100%; height: 100%; overflow: visible; }
.donut circle { transition: stroke-width .15s; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 56px; }
.dn-name { font-size: 13px; color: var(--sub); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dn-val { font-size: 20px; font-weight: 600; }
.legend-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 12px; }
.legend { display: flex; align-items: center; gap: 8px; min-height: 36px; border: 0; background: none; padding: 0 4px; border-radius: 8px; text-align: left; font-size: 14px; }
.legend .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend[aria-pressed="true"] { background: var(--bg); }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.trend { width: 100%; height: auto; display: block; }
.legend-inline { display: flex; gap: 16px; font-size: 12px; color: var(--sub); }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-inline i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend-inline i.ln { height: 2px; width: 14px; background: var(--text); border-radius: 1px; }
.top-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; border: 0; border-top: 1px solid var(--line); background: none; padding: 6px 0; text-align: left; }
.top-row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.top-row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-row .r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pill-btn.small { height: 34px; padding: 0 14px; font-size: 13px; color: var(--sub); background: transparent; border-color: var(--border); }
.pill-btn.small .ms { font-size: 16px; }
.reorder-row { gap: 10px; }
.reorder-row .icon-btn { width: 40px; height: 40px; color: var(--accent); }
.reorder-row .icon-btn:disabled { color: #D1D1D6; }
.update-bar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--safe-top) + 8px); z-index: 40; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(52,120,246,.35); white-space: nowrap; }
.update-bar .ms { font-size: 18px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + var(--safe-bottom)); transform: translateX(-50%); background: #22262C; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }

.login-wrap { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 48px);
  background: radial-gradient(120% 60% at 50% 0%, #DDF3EA 0%, var(--bg) 60%); }
.login-brand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 28px; text-align: center; }
.login-logo { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 24px rgba(24,120,104,.28); margin-bottom: 10px; }
.login-brand h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }

function getPeriod(card) {

function rangeOf(p) {
  const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
  switch (p.key) {
    case 'last_month': return [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))];
    case 'this_year': return [ymd(new Date(y, 0, 1)), ymd(now)];
    case 'last_30': return [ymd(addDays(now, -29)), ymd(now)];
    case 'last_6m': return [ymd(new Date(y, m - 5, 1)), ymd(now)];
    case 'last_12m': return [ymd(new Date(y, m - 11, 1)), ymd(now)];
    case 'custom': return [p.from || ymd(new Date(y, m, 1)), p.to || ymd(now)];
    default: return [ymd(new Date(y, m, 1)), ymd(now)];
  }
}
function prevRange([from, to]) {
  const f = parseYmd(from); const t = parseYmd(to);
  const days = Math.round((t - f) / 86400000) + 1;
  return [ymd(addDays(f, -days)), ymd(addDays(f, -1))];
}
function periodLabel(p) { return p.key === 'custom' ? `${shortDate(p.from)} – ${shortDate(p.to)}` : PERIOD_LABEL[p.key]; }

// A filter spec is { cats: [ids], labels: [ids] }. Picking a top category includes all of its subcategories.

  return names.length > 3 ? `${names.slice(0, 3).join(', ')} +${names.length - 3}` : names.join(', ');
}
function specMatcher(spec) {
  if (!spec || (!spec.cats?.length && !spec.labels?.length)) return () => true;
  const cats = new Set();
  (spec.cats || []).forEach((id) => { cats.add(id); subsOf(id).forEach((s) => cats.add(s.id)); });

  return (t) => cats.has(t.categoryId) || (t.labels || []).some((l) => labels.has(l));
}

// ---------- stats ----------
// Income vs expense comes from the money direction (Plaid: positive = money out), not from the category.
function stats([from, to], spec) {
  const ok = specMatcher(spec);
  const s = { income: 0, expense: 0, rows: {} };
  for (const t of S.txs) {
    if (t.date < from || t.date > to || t.isTransfer || !ok(t)) continue;
    const c = S.cats[t.categoryId]; const top = topOf(c);
    const side = t.amount < 0 ? 'income' : 'expense';
    const key = `${side}:${top ? top.id : 'unknown'}`;
    const v = Math.abs(t.amount);
    s[side] += v;
    const row = s.rows[key] || (s.rows[key] = { key, side, catId: top?.id || null, total: 0, subs: {} });
    row.total += v;
    const subKey = c && c.parentId ? c.id : '_self';
    row.subs[subKey] = (row.subs[subKey] || 0) + v;
  }
  return s;
}
function pctChange(cur, prev) { return prev ? Math.round(((cur - prev) / Math.abs(prev)) * 100) : null; }
function pctHtml(p, side) {
  if (p === null) return '<span class="p" style="color:var(--sub)">—</span>';

  return `<span class="p" style="color:var(${p === 0 ? '--sub' : good ? '--good' : '--bad'})">${p > 0 ? '+' : ''}${p}%</span>`;
}

function listen() {

  }, onErr));

  watch('accounts', 'accounts');
  watch('labels', 'labels');
  watch('filters', 'filters');
  watch('rules', 'rules', () => { S.rulesLoaded = true; scheduleRules(); });
  watch('items', 'items');
  subscribeTx();
}
function loadedSince() { return `${new Date().getFullYear() - 1}-01-01`; }
function subscribeTx() {
  if (S.txUnsub) S.txUnsub();
  const col = collection(db, 'transactions');
  const q = S.loadAll ? query(col, orderBy('date', 'desc')) : query(col, where('date', '>=', loadedSince()), orderBy('date', 'desc'));

  }, onErr);
}

async function seedCategories() {
  if (S.seeding) return; S.seeding = true;
  const batch = writeBatch(db);
  SEED.forEach((c, i) => {
    const ref = doc(collection(db, 'categories'));
    batch.set(ref, { name: c.name, icon: c.icon, color: c.color, hidden: false, parentId: null, order: i });
    c.subs.forEach(([name, ic, hidden], j) => {
      batch.set(doc(collection(db, 'categories')), { name, icon: ic, hidden: !!hidden, parentId: ref.id, order: j });
    });
  });
  try { await batch.commit(); } catch (e) { toast('Could not create categories: ' + errMsg(e)); }
  S.seeding = false;
}

// ---------- automatic rules ----------
// Runs in the app: each new transaction is checked once (marked ruled: true). Manual changes are never overwritten.
function ruleList() { return Object.values(S.rules).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function ruleMatches(r, t) {
  if (r.field === 'account') return t.accountId === r.accountId;
  const hay = `${t.name || ''} ${t.merchant || ''}`.toLowerCase();
  return (r.keywords || []).some((k) => k && hay.includes(k));
}
function ruleUpdates(t) {
  const upd = {}; let labels = null;
  for (const r of ruleList()) {
    if (!ruleMatches(r, t)) continue;
    if (r.categoryId && !t.categoryId && !upd.categoryId && S.cats[r.categoryId]) upd.categoryId = r.categoryId;
    if (r.labelId && S.labels[r.labelId] && !(t.labels || []).includes(r.labelId)) (labels ||= new Set(t.labels || [])).add(r.labelId);
    if (r.transfer && !t.isTransfer) upd.isTransfer = true;
  }
  if (labels) upd.labels = [...labels];
  return upd;
}
let rulesTimer;
function scheduleRules() { clearTimeout(rulesTimer); rulesTimer = setTimeout(() => applyRules(false), 800); }
async function applyRules(all) {
  if (S.applying || !S.rulesLoaded || !S.txLoaded || !ruleList().length) return 0;
  const cands = S.txs.filter((t) => !t.manual && (all || !t.ruled));
  if (!cands.length) return 0;
  S.applying = true; let changed = 0;
  try {
    const ops = [];
    for (const t of cands) {
      const upd = ruleUpdates(t);
      if (Object.keys(upd).length) changed++;
      if (Object.keys(upd).length || !t.ruled) ops.push([t.id, { ...upd, ruled: true }]);
    }
    for (let i = 0; i < ops.length; i += 450) {
      const b = writeBatch(db); ops.slice(i, i + 450).forEach(([id, u]) => b.update(doc(db, 'transactions', id), u)); await b.commit();
    }
  } catch (e) { console.error(e); } finally { S.applying = false; }
  return changed;
}

// ---- Expenses structure (donut) ----
function cardStructure() {
  const spec = cardSpec('structure').spec; const r = rangeOf(getPeriod('structure'));
  const s = stats(r, spec); const prev = stats(prevRange(r), spec);
  const drill = S.donutDrill && S.cats[S.donutDrill] ? S.cats[S.donutDrill] : null;
  let segs;
  if (drill) {
    const row = s.rows[`expense:${drill.id}`];
    segs = row ? Object.entries(row.subs).map(([k, v]) => {
      const c = k === '_self' ? drill : S.cats[k];
      return { id: k, name: k === '_self' ? `${drill.name} (general)` : (c?.name || 'Deleted'), value: v, color: '', cat: c };
    }) : [];
    const base = drill.color || '#8E8E93';
    segs.sort((a, b) => b.value - a.value).forEach((g, i) => { g.color = shade(base, i, segs.length); });
  } else {
    segs = Object.values(s.rows).filter((x) => x.side === 'expense').map((x) => {
      const c = x.catId ? S.cats[x.catId] : null;
      return { id: x.catId || 'unknown', name: c ? c.name : 'Uncategorized', value: x.total, color: c ? catColor(c) : '#C7C7CC', cat: c, hasSubs: c && Object.keys(x.subs).some((k) => k !== '_self') };
    }).sort((a, b) => b.value - a.value);
  }

  const sel = segs.find((g) => g.id === S.donutSel) || null;
  let off = 0;

    const len = (g.value / total) * 100; const gap = segs.length > 1 ? 0.6 : 0;
    const el = `<circle cx="90" cy="90" r="64" pathLength="100" fill="none" stroke="${g.color}" stroke-width="${sel && sel.id === g.id ? 30 : 24}"
      stroke-dasharray="${Math.max(len - gap, 0.01)} ${100 - Math.max(len - gap, 0.01)}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"
      data-act="donut-sel" data-id="${g.id}" style="cursor:pointer"><title>${esc(g.name)}</title></circle>`;
    off += len; return el;
  }).join('') : '';
  const center = sel

  const ch = drill ? null : pctChange(s.expense, prev.expense);

  const deeper = !drill && sel?.hasSubs ? `<button class="pill-btn" data-act="donut-drill" data-id="${sel.id}">${icon('zoom_in')}Go deeper</button>` : '';
  const back = drill ? `<button class="pill-btn" data-act="donut-back">${icon('chevron_left')}All categories</button>` : '';
  return `<section class="card">${cardHead('Expenses Structure', 'structure')}
    ${total ? `<div class="row-between"><div class="big num" style="font-size:26px">${money(total)}</div>${ch === null ? '' : `<span style="font-size:13px;color:var(${ch <= 0 ? '--good' : '--bad'})">${ch > 0 ? '+' : ''}${ch}% vs prior</span>`}</div>
    <div class="donut-wrap"><svg viewBox="0 0 180 180" class="donut" role="img" aria-label="Expenses by category">${arcs}</svg><div class="donut-center">${center}</div></div>
    <div class="legend-list">${legend}</div>

function shade(hex, i, n) {
  const c = hex.replace('#', ''); const [r, g, b] = [0, 2, 4].map((k) => parseInt(c.slice(k, k + 2), 16));
  const t = n > 1 ? (i / (n - 1)) * 0.65 : 0;

}

// ---- Cash flow trend ----
function buckets([from, to]) {
  const f = parseYmd(from); const t = parseYmd(to);
  const days = Math.round((t - f) / 86400000) + 1;
  const out = [];
  if (days <= 31) {
    for (let d = new Date(f); d <= t; d = addDays(d, 1)) out.push({ from: ymd(d), to: ymd(d), label: `${d.getMonth() + 1}/${d.getDate()}` });
  } else if (days <= 120) {
    for (let d = new Date(f); d <= t; d = addDays(d, 7)) { const e = addDays(d, 6) > t ? t : addDays(d, 6); out.push({ from: ymd(d), to: ymd(e), label: `${d.getMonth() + 1}/${d.getDate()}` }); }
  } else {
    for (let d = new Date(f.getFullYear(), f.getMonth(), 1); d <= t; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      out.push({ from: ymd(d < f ? f : d), to: ymd(e > t ? t : e), label: d.toLocaleDateString('en-US', { month: 'short' }) });
    }
  }
  return out;
}
function cardTrend() {
  const spec = cardSpec('trend').spec; const ok = specMatcher(spec);
  const bs = buckets(rangeOf(getPeriod('trend'))).map((b) => ({ ...b, inc: 0, exp: 0 }));
  const idx = (date) => { let lo = 0; let hi = bs.length - 1; while (lo <= hi) { const m = (lo + hi) >> 1; if (date < bs[m].from) hi = m - 1; else if (date > bs[m].to) lo = m + 1; else return m; } return -1; };
  for (const t of S.txs) {
    if (t.isTransfer || !ok(t)) continue;
    const i = idx(t.date); if (i < 0) continue;
    if (t.amount < 0) bs[i].inc += -t.amount; else bs[i].exp += t.amount;
  }
  const cum = S.trendMode === 'cumulative';
  let ci = 0; let ce = 0;
  const pts = bs.map((b) => { ci += b.inc; ce += b.exp; return cum ? { inc: ci, exp: ce } : { inc: b.inc, exp: b.exp }; });
  const net = pts.map((p) => p.inc - p.exp);
  const maxV = Math.max(1, ...pts.map((p) => Math.max(p.inc, p.exp)), ...net.map(Math.abs));
  const W = 340; const H = 190; const top = 12; const mid = 95; const half = 78; const n = bs.length;
  const slot = (W - 20) / Math.max(n, 1); const bw = Math.max(2, Math.min(22, slot * 0.6));
  const y = (v) => mid - (v / maxV) * half;
  const bars = pts.map((p, i) => {
    const x = 10 + slot * i + (slot - bw) / 2;
    return `<rect x="${x.toFixed(1)}" y="${y(p.inc).toFixed(1)}" width="${bw.toFixed(1)}" height="${(mid - y(p.inc)).toFixed(1)}" rx="2" fill="var(--inc)" opacity=".85"></rect>
      <rect x="${x.toFixed(1)}" y="${mid}" width="${bw.toFixed(1)}" height="${(y(-p.exp) - mid).toFixed(1)}" rx="2" fill="var(--exp)" opacity=".85"></rect>`;
  }).join('');
  const line = net.map((v, i) => `${(10 + slot * i + slot / 2).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const step = Math.ceil(n / 6);
  const labels = bs.map((b, i) => (i % step === 0 || i === n - 1) && !(i !== n - 1 && n - 1 - i < step / 2) ? `<text x="${(10 + slot * i + slot / 2).toFixed(1)}" y="${H - 2}" text-anchor="middle" font-size="10" fill="var(--sub)">${b.label}</text>` : '').join('');
  const totalNet = net.length ? (cum ? net[net.length - 1] : net.reduce((a, b) => a + b, 0)) : 0;
  return `<section class="card">${cardHead('Cash Flow Trend', 'trend')}
    <div class="row-between"><div class="big num" style="font-size:26px">${money(totalNet, true)}</div>
      <div class="seg"><button data-act="trend-mode" data-mode="trend" aria-pressed="${!cum}">Trend</button><button data-act="trend-mode" data-mode="cumulative" aria-pressed="${cum}">Cumulative</button></div></div>
    <svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Income, expenses and net cash flow over time">
      <line x1="6" x2="${W - 6}" y1="${mid}" y2="${mid}" stroke="var(--line)" stroke-width="1"></line>${bars}
      ${n > 1 ? `<polyline points="${line}" fill="none" stroke="var(--text)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>` : ''}${labels}</svg>
    <div class="legend-inline"><span><i style="background:var(--inc)"></i>Income</span><span><i style="background:var(--exp)"></i>Expenses</span><span><i class="ln"></i>Net</span></div>
  </section>`;
}

// ---- Spending + top 5 expenses ----
function cardTop() {
  const spec = cardSpec('top').spec; const ok = specMatcher(spec); const r = rangeOf(getPeriod('top'));
  const list = S.txs.filter((t) => t.date >= r[0] && t.date <= r[1] && !t.isTransfer && t.amount > 0 && ok(t));
  const bs = buckets(r).map((b) => ({ ...b, v: 0 }));
  list.forEach((t) => { const b = bs.find((x) => t.date >= x.from && t.date <= x.to); if (b) b.v += t.amount; });
  const max = Math.max(1, ...bs.map((b) => b.v)); const n = bs.length;
  const W = 340; const H = 110; const slot = (W - 12) / Math.max(n, 1); const bw = Math.max(2, Math.min(20, slot * 0.65));
  const bars = bs.map((b, i) => { const h = (b.v / max) * 86; const x = 6 + slot * i + (slot - bw) / 2; return `<rect x="${x.toFixed(1)}" y="${(92 - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h, b.v ? 2 : 0).toFixed(1)}" rx="2" fill="var(--accent)" opacity=".8"><title>${b.label}: ${money(b.v)}</title></rect>`; }).join('');
  const first = bs[0]?.label || ''; const last = bs[n - 1]?.label || '';
  const top5 = [...list].sort((a, b) => b.amount - a.amount).slice(0, 5);
  const rows = top5.map((t) => { const c = S.cats[t.categoryId]; return `<button class="top-row" data-act="tx" data-id="${t.id}">${catIcon(c)}<span class="mid"><span class="n">${esc(t.note || t.merchant || t.name)}</span><span class="meta">${esc(c ? c.name : 'Uncategorized')} · ${esc(accName(S.accounts[t.accountId]))}</span></span><span class="r"><span class="num" style="color:var(--exp)">-${money(t.amount)}</span><span class="meta">${shortDate(t.date).replace(/, \d{4}$/, '')}</span></span></button>`; }).join('');
  return `<section class="card">${cardHead('Spending', 'top')}
    <div class="big num" style="font-size:26px">${money(list.reduce((a, t) => a + t.amount, 0))}</div>
    <svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Spending over time"><line x1="4" x2="${W - 4}" y1="92" y2="92" stroke="var(--line)"></line>${bars}
      <text x="6" y="${H - 2}" font-size="10" fill="var(--sub)">${first}</text><text x="${W - 6}" y="${H - 2}" font-size="10" fill="var(--sub)" text-anchor="end">${last}</text></svg>
    <div class="sec-head">Top 5 expenses</div>
    ${rows || '<div class="meta">No expenses in this period</div>'}
  </section>`;
}

function pickerBody(q) {
  const t = S.txById[S.picker.txId];
  const sel = S.picker.mode === 'edit' ? S.edit.categoryId : S.picker.mode === 'rule' ? S.ruleDraft.categoryId : t?.categoryId;
  const vt = visibleTops();
  const pickBtn = (c, sub = false) => `<button class="pick${sub ? ' sub' : ''}" data-act="pick-cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${catIcon(c)}<span class="n">${esc(c.name)}</span></button>`;
  if (q) {
    const all = vt.flatMap((c) => [c, ...subsOf(c.id).filter((x) => !x.hidden)]);
    const hits = all.filter((c) => c.name.toLowerCase().includes(q));
    return hits.map((c) => `<button class="pick" data-act="pick-cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${catIcon(c)}<span class="n">${esc(c.name)}${c.parentId ? `<span class="meta"> · ${esc(S.cats[c.parentId]?.name || '')}</span>` : ''}</span></button>`).join('') || '<div class="meta">No matching categories</div>';
  }
  const ids = new Set(vt.flatMap((c) => [c.id, ...subsOf(c.id).filter((x) => !x.hidden).map((x) => x.id)]));
  const counts = {};
  S.txs.forEach((x) => { if (ids.has(x.categoryId)) counts[x.categoryId] = (counts[x.categoryId] || 0) + 1; });
  const freq = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 8).map((id) => S.cats[id]);
  const freqHtml = freq.length ? `<div class="sec-head">Most frequent</div><div class="freq">${freq.map((c) => `<button data-act="pick-cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${catIcon(c)}<span>${esc(c.name)}</span></button>`).join('')}</div>` : '';
  const list = vt.map((c) => {
    const subs = subsOf(c.id).filter((x) => !x.hidden);
    if (!subs.length) return pickBtn(c);
    const open = S.pickOpen.has(c.id);
    return `<button class="pick${open ? ' open' : ''}" data-act="pick-open" data-id="${c.id}" aria-expanded="${open}">${catIcon(c)}<span class="n">${esc(c.name)}</span><span class="ms chev" aria-hidden="true">expand_more</span></button>

  return `${freqHtml}<div class="sec-head">All categories</div>${list}`;
}

async function saveEdit() {

// ---------- actions ----------
async function addDemo() {
  if (S.txs.some((t) => t.demo)) { toast('Demo data is already there'); return; }
  const findCat = (top, sub) => {
    const t = tops().find((c) => c.name === top); if (!t) return null;
    if (!sub) return t.id;
    return subsOf(t.id).find((c) => c.name === sub)?.id || t.id;
  };
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const b = writeBatch(db);
  DEMO_ACCOUNTS.forEach((a) => b.set(doc(db, 'accounts', a.id), { ...a, demo: true }));
  let n = 0;
  DEMO_TX.forEach(([merchant, top, sub, min, max, count, acc, transfer]) => {
    for (let i = 0; i < count; i++) {
      const amt = Math.round((min + rnd() * (max - min)) * 100) / 100;
      const date = ymd(addDays(new Date(), -Math.floor(rnd() * 75)));
      b.set(doc(db, 'transactions', `demo_${n++}`), {
        accountId: acc, itemId: null, date, name: merchant, merchant, amount: amt, currency: 'USD', pending: false,
        categoryId: top ? findCat(top, sub) : null, labels: [], isTransfer: !!transfer, demo: true, createdAt: serverTimestamp(),
      });
    }
  });
  await b.commit();
  toast(`Added ${n} demo records`);
}
async function removeDemo() {
  const txs = S.txs.filter((t) => t.demo || String(t.accountId).startsWith('demo_'));
  const accs = Object.values(S.accounts).filter((a) => a.demo);
  if (!txs.length && !accs.length) { toast('No demo data'); return; }
  if (!confirm(`Delete ${txs.length} demo records and ${accs.length} demo accounts?`)) return;
  const refs = [...txs.map((t) => doc(db, 'transactions', t.id)), ...accs.map((a) => doc(db, 'accounts', a.id))];
  for (let i = 0; i < refs.length; i += 450) { const bb = writeBatch(db); refs.slice(i, i + 450).forEach((r) => bb.delete(r)); await bb.commit(); }
  toast('Demo data removed');
}
async function doSync(itemId) {
  toast('Syncing…', 60000);
  try {
    const { data } = await call('syncNow')(itemId ? { itemId } : {});
    const errs = data.results.filter((r) => r.error);
    const added = data.results.reduce((n, r) => n + (r.added || 0), 0);
    toast(errs.length ? `${errs.length} bank(s) had sync errors. See the Accounts page.` : `Synced. ${added} new record${added === 1 ? '' : 's'}.`);
  } catch (e) { toast('Sync failed: ' + errMsg(e)); }
}
async function openLink(itemId) {
  toast('Opening bank connection…');
  try {
    const { data } = await call('createLinkToken')({ itemId: itemId || null });
    localStorage.setItem('plaidLink', JSON.stringify({ token: data.linkToken, itemId: itemId || null }));
    startLink(data.linkToken, itemId, null);
  } catch (e) { toast('Could not open: ' + errMsg(e)); }
}
function startLink(token, itemId, receivedRedirectUri) {
  const handler = window.Plaid.create({
    token,
    receivedRedirectUri: receivedRedirectUri || undefined,
    onSuccess: async (publicToken, meta) => {
      localStorage.removeItem('plaidLink');
      try {
        if (itemId) { await doSync(itemId); } else {
          toast('Connected. Importing records, this can take a minute or two…', 120000);
          const { data } = await call('exchangePublicToken')({ publicToken, institution: meta.institution });
          toast(data.error ? 'Connected. Records are still being prepared; tap Refresh in a bit.' : `Connected ${meta.institution?.name || ''}. Imported ${data.added || 0} records.`);
        }
      } catch (e) { toast('Connection failed: ' + errMsg(e)); }
    },
    onExit: (err) => {
      localStorage.removeItem('plaidLink');
      if (err) toast('Connection not finished: ' + (err.display_message || err.error_message || err.error_code));
    },
  });
  handler.open();
}
async function setTxCategory(txId, catId, sameMerchant) {
  const t = S.txById[txId]; if (!t) return;
  const batch = writeBatch(db);
  batch.update(doc(db, 'transactions', txId), { categoryId: catId || null });
  let n = 0;
  if (catId && sameMerchant) {
    const key = (t.merchant || t.name).toLowerCase();
    S.txs.filter((x) => x.id !== txId && !x.categoryId && !x.isTransfer && (x.merchant || x.name).toLowerCase() === key)
      .slice(0, 450).forEach((x) => { batch.update(doc(db, 'transactions', x.id), { categoryId: catId }); n++; });
  }
  await batch.commit();
  toast(n ? `Saved. ${n} more record${n === 1 ? '' : 's'} from this merchant updated too.` : 'Saved');
}
async function deleteCategory(id) {
  const c = S.cats[id]; if (!c) return;
  const isTop = !c.parentId;
  const subs = isTop ? subsOf(id) : [];
  const ids = [id, ...subs.map((s) => s.id)];
  const txs = S.txs.filter((t) => ids.includes(t.categoryId));
  const msg = isTop
    ? `Delete “${c.name}” and its ${subs.length} subcategories? ${txs.length} records will become uncategorized.`
    : `Delete subcategory “${c.name}”? ${txs.length} records will move to “${S.cats[c.parentId]?.name}”.`;
  if (!confirm(msg)) return;
  const ops = [];
  txs.forEach((t) => ops.push((b) => b.update(doc(db, 'transactions', t.id), { categoryId: isTop ? null : c.parentId })));
  ids.forEach((cid) => ops.push((b) => b.delete(doc(db, 'categories', cid))));
  for (let i = 0; i < ops.length; i += 450) { const b = writeBatch(db); ops.slice(i, i + 450).forEach((op) => op(b)); await b.commit(); }
  location.hash = isTop ? '#/cats' : `#/cat/${c.parentId}`;
  toast('Deleted');
}
async function deleteLabel(id) {
  const l = S.labels[id]; if (!l) return;
  const txs = S.txs.filter((t) => (t.labels || []).includes(id));
  if (!confirm(`Delete label “${l.name}”? It will be removed from ${txs.length} loaded records.`)) return;
  const ops = txs.map((t) => (b) => b.update(doc(db, 'transactions', t.id), { labels: arrayRemove(id) }));
  Object.values(S.filters).filter((f) => (f.labels || []).includes(id)).forEach((f) => ops.push((b) => b.update(doc(db, 'filters', f.id), { labels: arrayRemove(id) })));
  ops.push((b) => b.delete(doc(db, 'labels', id)));
  for (let i = 0; i < ops.length; i += 450) { const b = writeBatch(db); ops.slice(i, i + 450).forEach((op) => op(b)); await b.commit(); }
  closeSheet(); toast('Label deleted');
}
async function addCategory(name, parentId) {
  const siblings = parentId ? subsOf(parentId) : tops();
  const order = siblings.reduce((m, c) => Math.max(m, c.order ?? 0), -1) + 1;
  const ref = doc(collection(db, 'categories'));
  const data = parentId
    ? { name, icon: S.cats[parentId]?.icon || 'category', hidden: false, parentId, order }
    : { name, icon: 'category', color: COLORS[order % COLORS.length], hidden: false, parentId: null, order };
  await setDoc(ref, data);
  return ref.id;
}

}

        sheet.dataset.color = el.dataset.color;
        sheet.querySelectorAll('[data-act="pick-color"]').forEach((b) => b.setAttribute('aria-pressed', b === el));
        if ($('lbl-prev')) $('lbl-prev').innerHTML = labelPill({ name: $('nm').value || 'Label', color: el.dataset.color });
        break;
      case 'pick-icon':
        sheet.dataset.icon = el.dataset.icon;
        sheet.querySelectorAll('[data-act="pick-icon"]').forEach((b) => b.setAttribute('aria-pressed', b === el));
        break;
      case 'save-acc': {
        const name = $('an').value.trim();
        await updateDoc(doc(db, 'accounts', id), { customName: name || deleteField(), color: sheet.dataset.color || deleteField(), hidden: $('ah').checked });
        closeSheet(); toast('Saved'); break;
      }
      case 'edit-icon': sheetIcon(id); break;
      case 'save-icon': {
        const upd = { icon: sheet.dataset.icon };
        if (!S.cats[id].parentId && sheet.dataset.color) upd.color = sheet.dataset.color;
        await updateDoc(doc(db, 'categories', id), upd); closeSheet(); break;
      }
      case 'rename': sheetName('Rename', S.cats[id].name, 'save-name', id); break;
      case 'save-name': { const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; } await updateDoc(doc(db, 'categories', id), { name }); closeSheet(); break; }
      case 'add-sub': sheetName('New subcategory', '', 'save-sub', id); break;
      case 'save-sub': { const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; } await addCategory(name, id); closeSheet(); break; }
      case 'add-cat': sheetName('New category', '', 'save-top', ''); break;
      case 'save-top': { const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; } const nid = await addCategory(name, null); closeSheet(); location.hash = `#/cat/${nid}`; break; }
      case 'del-cat': await deleteCategory(id); break;
      case 'add-tx': openNew(); break;
      case 'toggle-label': {
        const on = el.getAttribute('aria-pressed') !== 'true';
        el.setAttribute('aria-pressed', on);
        if (el.dataset.tx) await updateDoc(doc(db, 'transactions', el.dataset.tx), { labels: on ? arrayUnion(id) : arrayRemove(id) });
        break;
      }
      case 'new-label': {
        const l = await newLabel(); if (!l) break;
        const tx = el.dataset.tx;
        if (tx) await updateDoc(doc(db, 'transactions', tx), { labels: arrayUnion(l.id) });
        const chipEl = document.createElement('button');
        chipEl.className = 'chip'; chipEl.dataset.act = 'toggle-label'; chipEl.dataset.id = l.id; chipEl.dataset.tx = tx || '';
        chipEl.setAttribute('aria-pressed', 'true'); chipEl.textContent = l.name;
        el.before(chipEl);
        break;
      }
      case 'del-tx': if (!confirm('Delete this record?')) break; await deleteDoc(doc(db, 'transactions', id)); closeSheet(); toast('Deleted'); break;
      case 'add-label': sheetLabel(null); break;
      case 'edit-label': sheetLabel(id); break;
      case 'save-label': {
        const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; }
        const color = sheet.dataset.color || LABEL_COLORS[0];
        if (id) await updateDoc(doc(db, 'labels', id), { name, color }); else await setDoc(doc(collection(db, 'labels')), { name, color, createdAt: serverTimestamp() });
        closeSheet(); break;
      }
      case 'del-label': await deleteLabel(id); break;
      case 'add-filter': sheetFilter(null); break;
      case 'edit-filter': sheetFilter(id); break;
      case 'save-filter': {
        const name = $('fl-name').value.trim(); if (!name) { toast('Give the filter a name'); return; }
        const spec = mselSpec(); if (!spec.cats.length && !spec.labels.length) { toast('Pick at least one category or label'); return; }
        if (id) await updateDoc(doc(db, 'filters', id), { name, ...spec }); else await setDoc(doc(collection(db, 'filters')), { name, ...spec });
        closeSheet(); toast('Filter saved'); break;
      }
      case 'del-filter': {
        if (!confirm('Delete this filter?')) break;
        await deleteDoc(doc(db, 'filters', id));
        ['cashflow', 'detail', 'structure', 'trend', 'top'].forEach((c) => { if (savedFilterId(c) === id) localStorage.removeItem('filter:' + c); });
        closeSheet(); toast('Filter deleted'); break;
      }
      case 'add-rule': sheetRule(null); break;
      case 'edit-rule': sheetRule(id); break;
      case 'save-rule': await saveRule(); break;
      case 'del-rule': if (!confirm('Delete this rule?')) break; await deleteDoc(doc(db, 'rules', id)); closeSheet(); toast('Rule deleted'); break;
      case 'run-rules': { toast('Applying rules…'); const n = await applyRules(true); toast(n ? `Updated ${n} record${n === 1 ? '' : 's'}` : 'No records needed changes'); break; }
      case 'demo-add': closeDrawer(); await addDemo(); break;
      case 'demo-del': closeDrawer(); await removeDemo(); break;
      default: break;
    }
  } catch (err) { console.error(err); toast('Something went wrong: ' + errMsg(err)); }
});

let searchTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'nm' && $('lbl-prev')) { $('lbl-prev').innerHTML = labelPill({ name: e.target.value || 'Label', color: $('sheet').dataset.color }); return; }
  if (e.target.id === 'ed-amt') { e.target.style.width = `${Math.max(4, e.target.value.length) + 0.5}ch`; return; }
  if (e.target.id === 'catq') { $('catpick').innerHTML = pickerBody(e.target.value.trim().toLowerCase()); return; }
  if (e.target.id !== 'txsearch') return;
  S.search = e.target.value;
  clearTimeout(searchTimer); searchTimer = setTimeout(render, 150);
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.cardShow) {
    const h = cardHidden(); el.checked ? h.delete(el.dataset.cardShow) : h.add(el.dataset.cardShow);
    localStorage.setItem('cardHidden', JSON.stringify([...h])); render(); return;
  }
  if (el.dataset.msel) { el.checked ? S.msel.add(el.dataset.msel) : S.msel.delete(el.dataset.msel); return; }
  try {
    if (el.dataset.act === 'cat-show') await updateDoc(doc(db, 'categories', el.dataset.id), { hidden: !el.checked });
  } catch (err) { toast('Could not save: ' + errMsg(err)); }
});

// ---------- update check ----------
// Looks for a newer index.html (bypassing caches) and offers a one-tap reload.
async function checkUpdate(manual) {
  try {
    const res = await fetch(`${location.pathname}?check=${Date.now()}`, { cache: 'no-store' });
    const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) {
      $('update').innerHTML = `<button class="update-bar" data-act="do-update" data-v="${esc(m[1])}">${icon('system_update')}Version ${esc(m[1])} is available · Tap to update</button>`;
    } else if (manual) toast(`You are on the latest version (${APP_VERSION})`);
  } catch { if (manual) toast('Could not check for updates'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false); });
checkUpdate(false);

// ---------- login ----------
function viewLogin() {
  S.unsub.forEach((u) => u()); S.unsub = [];
  if (S.txUnsub) { S.txUnsub(); S.txUnsub = null; }
  S.loadAll = false; S.instant = {};
  $('app').innerHTML = `<div class="login-wrap"><div class="login-brand">
      <img src="icon-192.png" alt="" width="84" height="84" class="login-logo">
      <h1>${APP_NAME}</h1><p>Every card, one place.</p></div>
    <form class="login" id="lf">
      <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" autocomplete="username" required></div>
      <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="pill-btn primary wide" type="submit">Sign in</button>
      <button class="link-btn" type="button" id="forgot">Forgot password?</button></form></div>`;
  $('forgot').addEventListener('click', async () => {
    const em = $('em').value.trim();
    if (!em) { toast('Enter your email first'); $('em').focus(); return; }
    try { await sendPasswordResetEmail(auth, em); toast('Password reset email sent. Check your inbox.', 4500); } catch { toast('Could not send the reset email. Check the address.'); }
  });
  $('lf').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); } catch { toast('Sign-in failed: check your email and password'); }
  });
}

onAuthStateChanged(auth, (u) => {
  S.user = u;
  if (!u) { viewLogin(); return; }
  listen(); render();
  // Returning from an OAuth bank login (e.g. Chase): finish the Plaid connection
  const qs = new URLSearchParams(location.search);
  if (qs.has('oauth_state_id')) {
    const saved = JSON.parse(localStorage.getItem('plaidLink') || 'null');
    const href = location.href;
    history.replaceState(null, '', location.pathname + location.hash);
    if (saved) startLink(saved.token, saved.itemId, href);
  }
});
